<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftex | True Anonymity for Secret Santa</title>
    
    <!-- Placeholder Favicon (Gift Emoji) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-pure: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --accent-hover: rgba(255, 255, 255, 0.8);
            --border-subtle: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
        }

        .logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-links a {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-pure) !important;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-weight: 500;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Subtle background glow effect */
        .hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            max-width: 800px;
        }

        .hero p {
            font-size: clamp(1.125rem, 2vw, 1.25rem);
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .hero-cta {
            display: inline-block;
            background-color: var(--accent);
            color: var(--bg-pure);
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .hero-cta:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .features {
            padding: 8rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 4rem 2rem;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .feature-item h3 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .feature-item p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            nav {
                padding: 1rem 1.5rem;
            }
            .nav-links a:not(.btn-primary) {
                display: none;
            }
            .features {
                padding: 4rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <img src="https://i.imgur.com/ZrmR6uR.png" alt="Giftex Logo" class="logo-img">
        <div class="nav-links">
            <a href="auth.html">Log in</a>
            <a href="auth.html" class="btn-primary">Get Started</a>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h1>Absolute Secrecy.</h1>
            <p>The only platform that guarantees the organizer never knows who matched with whom. Cloud-processed, instantly dispatched.</p>
            <a href="auth.html" class="hero-cta">Start an Exchange</a>
        </section>
    </main>

</body>
</html>
