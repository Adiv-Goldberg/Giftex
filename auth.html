<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftex | Log in</title>
    
    <!-- Favicon -->
    <link rel="icon" href="https://i.imgur.com/ZrmR6uR.png" type="image/png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-pure: #000000;
            --text-main: #ffffff;
            --text-muted: #888888;
            --text-error: #ff5555;
            --accent: #ffffff;
            --border-subtle: rgba(255, 255, 255, 0.2);
            --border-focus: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        nav {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .back-link {
            font-size: 0.875rem;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            margin-bottom: 2.5rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-main);
            font-size: 1rem;
            padding: 0.75rem 0;
            transition: border-color 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-bottom-color: var(--border-focus);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            outline: none;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: var(--bg-pure);
            border: none;
            padding: 1rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 1rem;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-mode {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .toggle-mode span {
            color: var(--text-main);
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        #toggleLink {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .toggle-mode span:hover {
            opacity: 0.7;
        }

        .error-message {
            color: var(--text-error);
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 20px;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--bg-pure);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading .btn-text {
            display: none;
        }
        
        .loading .loader {
            display: block;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand-link">
            <img src="https://i.imgur.com/ZrmR6uR.png" alt="Giftex Logo" class="logo-img">
            <span class="brand-name">GiftEx</span>
        </a>
        <a href="index.html" class="back-link">Back to Home</a>
    </nav>

    <main>
        <div class="auth-container">
            <div class="auth-header">
                <h1 id="pageTitle">Log in</h1>
                <p id="pageSubtitle">Enter your details to access your account.</p>
            </div>

            <form id="authForm">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email address" required>
                </div>
                <div class="form-group password-container">
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
                        <!-- Default: Eye closed -->
                        <svg id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text" id="btnText">Continue</span>
                    <span class="loader"></span>
                </button>

                <div class="error-message" id="errorMsg"></div>
            </form>

            <div class="toggle-mode">
                <span id="toggleText">Don't have an account? <span id="toggleLink">Sign up</span></span>
            </div>
        </div>
    </main>

    <script>
        const SHEET_ID = '1cM6OQBR7X48aI_8oOaQVJ_3kwCuUOjpsZaAPJC1E3Y4';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=api&range=A1`;

        async function getScriptUrl() {
            let url = sessionStorage.getItem('giftex_script_url');
            if (url) return url;
            
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                
                // Securely extract the URL from the JSON response
                const match = text.match(/(https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec)/);
                if (match) {
                    sessionStorage.setItem('giftex_script_url', match[0]);
                    return match[0];
                }
                
                // Fallback to CSV Export if the GViz endpoint fails to parse
                const fallbackUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&sheet=api&range=A1`;
                const fallbackResp = await fetch(fallbackUrl);
                const fallbackText = await fallbackResp.text();
                const fallbackMatch = fallbackText.match(/(https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec)/);
                
                if (fallbackMatch) {
                    sessionStorage.setItem('giftex_script_url', fallbackMatch[0]);
                    return fallbackMatch[0];
                }
                
                throw new Error("Service unavailable.");
            } catch (err) {
                throw new Error("A connection error occurred. Please refresh the page and try again.");
            }
        }

        // Auto-redirect if session exists (User is already logged in)
        if (localStorage.getItem('giftex_userId')) {
            window.location.href = 'dashboard.html';
        }

        // State variables
        let isLoginMode = true;

        // DOM Elements
        const form = document.getElementById('authForm');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const toggleText = document.getElementById('toggleText');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        
        // Password Visibility Elements
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        // Toggle Password Visibility Logic
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'text') {
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            }
        });

        // Toggle between Login and Register modes
        toggleText.addEventListener('click', (e) => {
            if (e.target.id !== 'toggleLink') return;
            
            isLoginMode = !isLoginMode;
            errorMsg.textContent = ''; 
            
            if (isLoginMode) {
                document.title = "Giftex | Log in";
                pageTitle.textContent = 'Log in';
                pageSubtitle.textContent = 'Enter your details to access your account.';
                toggleText.innerHTML = 'Don\'t have an account? <span id="toggleLink">Sign up</span>';
            } else {
                document.title = "Giftex | Create account";
                pageTitle.textContent = 'Create account';
                pageSubtitle.textContent = 'Set up your master account to manage exchanges.';
                toggleText.innerHTML = 'Already have an account? <span id="toggleLink">Log in</span>';
            }
        });

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            errorMsg.textContent = '';

            const payload = {
                action: isLoginMode ? 'login' : 'register',
                email: email,
                password: password
            };

            try {
                const SCRIPT_URL = await getScriptUrl();
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.error) {
                    throw new Error(result.error);
                }

                if (result.success) {
                    localStorage.setItem('giftex_userId', result.userId);
                    localStorage.setItem('giftex_role', result.role);
                    localStorage.setItem('giftex_email', email);
                    
                    window.location.href = 'dashboard.html';
                }

            } catch (err) {
                errorMsg.textContent = err.message || "A connection error occurred. Please try again.";
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
