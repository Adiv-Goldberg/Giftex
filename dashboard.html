<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giftex | Dashboard</title>
    <link rel="icon" href="https://i.imgur.com/ZrmR6uR.png" type="image/png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-pure: #000000; --text-main: #ffffff; --text-muted: #888888;
            --text-error: #ff5555; --accent: #ffffff;
            --border-subtle: rgba(255, 255, 255, 0.15); --border-focus: rgba(255, 255, 255, 0.8);
            --hover-bg: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-pure); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        a { text-decoration: none; color: inherit; }

        nav { padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); }
        .brand-link { display: flex; align-items: center; gap: 0.75rem; }
        .logo-img { height: 28px; width: auto; object-fit: contain; }
        .brand-name { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }

        .nav-actions { display: flex; align-items: center; gap: 1.5rem; }
        .user-email { font-size: 0.875rem; color: var(--text-muted); }
        .logout-btn { font-size: 0.875rem; color: var(--text-main); background: none; border: none; cursor: pointer; transition: opacity 0.2s; }
        .logout-btn:hover { opacity: 0.7; }

        main { flex: 1; padding: 4rem 2rem; max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 4rem; }
        
        .auth-warning { text-align: center; padding: 4rem 0; }
        .auth-warning h2 { font-weight: 500; margin-bottom: 1.5rem; letter-spacing: -0.02em; }
        .auth-warning a { background-color: var(--accent); color: var(--bg-pure); padding: 0.75rem 1.5rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; display: inline-block; }

        .section-header { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 2rem; }

        .creation-form { display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap; }
        .form-row { display: flex; gap: 1.5rem; width: 100%; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 200px; position: relative; }
        .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-group input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border-subtle); color: var(--text-main); font-size: 1rem; padding: 0.5rem 0; transition: border-color 0.2s; outline: none; }
        .form-group input[type="date"]::-webkit-calendar-picker-indicator, .form-group input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; transition: opacity 0.2s; }
        .form-group input[type="date"]::-webkit-calendar-picker-indicator:hover, .form-group input[type="time"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
        .form-group input:focus { border-bottom-color: var(--border-focus); }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }

        .btn-submit { background-color: var(--accent); color: var(--bg-pure); border: none; padding: 0 1.5rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: opacity 0.2s, transform 0.1s; height: 40px; display: flex; align-items: center; justify-content: center; min-width: 100px; }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .error-message { color: var(--text-error); font-size: 0.875rem; margin-top: 1rem; display: none; width: 100%; word-wrap: break-word; }

        .groups-list { display: flex; flex-direction: column; gap: 0.25rem; }
        .group-item { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1rem; margin: 0 -1rem; border-radius: 8px; transition: background-color 0.2s; cursor: pointer; border: 1px solid transparent; }
        .group-item:hover { background-color: var(--hover-bg); }
        .group-item.dispatched { border-color: rgba(74, 222, 128, 0.2); }
        .group-info h3 { font-size: 1.125rem; font-weight: 500; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .group-info h3 .status-badge { font-size: 0.7rem; background: rgba(74, 222, 128, 0.2); color: #4ade80; padding: 0.15rem 0.5rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        .group-info p { font-size: 0.875rem; color: var(--text-muted); }
        .group-actions { display: flex; align-items: center; gap: 1rem; }
        .group-arrow { color: var(--text-muted); transition: transform 0.2s, color 0.2s; }
        .group-item:hover .group-arrow { transform: translateX(4px); color: var(--text-main); }
        .delete-group-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.5rem; transition: color 0.2s; display: flex; align-items: center; justify-content: center; }
        .delete-group-btn:hover { color: var(--text-error); }
        
        .empty-state { color: var(--text-muted); font-size: 0.95rem; padding: 2rem 0; display: none; flex-direction: column; align-items: flex-start; gap: 1.5rem; }
        
        .admin-link { font-size: 0.8rem; font-weight: 500; color: var(--accent); border: 1px solid var(--border-subtle); padding: 0.35rem 0.85rem; border-radius: 999px; transition: all 0.2s; }
        .admin-link:hover { border-color: var(--border-focus); background: rgba(255,255,255,0.05); }

        .btn-loader { display: none; width: 14px; height: 14px; border: 2px solid var(--bg-pure); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        .page-loader { width: 24px; height: 24px; border: 2px solid var(--text-muted); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; margin: 2rem 0; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading .btn-text { display: none; }
        .loading .btn-loader { display: block; }
    </style>
</head>
<body>
    <nav>
        <a href="dashboard.html" class="brand-link">
            <img src="https://i.imgur.com/ZrmR6uR.png" alt="Giftex Logo" class="logo-img">
            <span class="brand-name">GiftEx</span>
        </a>
        <div class="nav-actions" id="navActions" style="display: none;">
            <span class="user-email" id="userEmailDisplay"></span>
            <button id="logoutBtn" class="logout-btn">Log out</button>
        </div>
    </nav>

    <main>
        <div id="authWarning" class="auth-warning" style="display: none;">
            <h2>You are not logged in.</h2>
            <a href="auth.html">Sign In</a>
        </div>

        <div id="dashboardContent" style="display: none; flex-direction: column; gap: 4rem;">
            <section>
                <h2 class="section-header">New Exchange</h2>
                <form id="createGroupForm" class="creation-form">
                    <div class="form-row">
                        <div class="form-group" style="flex: 2;">
                            <label for="groupName">Exchange Name</label>
                            <input type="text" id="groupName" placeholder="e.g. Office Secret Santa" required>
                        </div>
                        <div class="form-group">
                            <label for="groupBudget">Budget (Optional)</label>
                            <div style="position: relative; display: flex; align-items: center;">
                                <span style="position: absolute; left: 0; color: var(--text-muted); font-size: 1rem; pointer-events: none;">$</span>
                                <input type="text" id="groupBudget" placeholder="20.50" style="padding-left: 1.1rem;">
                            </div>
                        </div>
                    </div>
                    <div class="form-row" style="margin-top: 0.5rem;">
                        <div class="form-group">
                            <label for="exchangeDate">Exchange Date <span style="float: right; text-transform: none; font-weight: 500; display: inline-flex; align-items: center; gap: 0.25rem;"><input type="checkbox" id="isTba" style="width: auto; margin: 0; cursor: pointer;"> TBA</span></label>
                            <input type="date" id="exchangeDate" required>
                        </div>
                        <div class="form-group">
                            <label for="exchangeTime">Time (Optional)</label>
                            <input type="time" id="exchangeTime">
                        </div>
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <span class="btn-text">Create</span>
                            <span class="btn-loader"></span>
                        </button>
                    </div>
                    <div class="error-message" id="errorMsg"></div>
                </form>
            </section>

            <section>
                <h2 class="section-header">Your Exchanges</h2>
                <div id="pageLoader" class="page-loader"></div>
                <div id="emptyState" class="empty-state">
                    <p id="emptyText">You haven't created any exchanges yet.</p>
                    <button type="button" class="btn-submit" onclick="document.getElementById('groupName').focus()">Create New Exchange</button>
                </div>
                <div id="groupsList" class="groups-list"></div>
            </section>
        </div>
    </main>

    <script>
        async function getScriptUrl() {
            sessionStorage.removeItem('giftex_script_url');
            try {
                const sheetId = '1cM6OQBR7X48aI_8oOaQVJ_3kwCuUOjpsZaAPJC1E3Y4';
                const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&headers=0&sheet=api&range=A1&cb=${Date.now()}`;
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
                return json.table.rows[0]?.c[0]?.f ?? json.table.rows[0]?.c[0]?.v;
            } catch (err) {
                throw new Error("Unable to read config.");
            }
        }

        async function apiCall(payload) {
            const SCRIPT_URL = await getScriptUrl();
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const text = await response.text();
            const result = JSON.parse(text);
            if (result.error) throw new Error(result.error);
            return result;
        }

        const userId = localStorage.getItem('giftex_userId');
        const userRole = localStorage.getItem('giftex_role');
        const userEmail = localStorage.getItem('giftex_email') || 'Account';

        const authWarning = document.getElementById('authWarning');
        const dashboardContent = document.getElementById('dashboardContent');
        const navActions = document.getElementById('navActions');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const createForm = document.getElementById('createGroupForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const groupsList = document.getElementById('groupsList');
        const emptyState = document.getElementById('emptyState');
        const emptyText = document.getElementById('emptyText');
        const pageLoader = document.getElementById('pageLoader');
        const dateInput = document.getElementById('exchangeDate');

        if (!userId) {
            authWarning.style.display = 'block';
        } else {
            navActions.style.display = 'flex';
            userEmailDisplay.textContent = userEmail;
            dashboardContent.style.display = 'flex';
            
            const today = new Date().toISOString().split('T')[0];
            dateInput.setAttribute('min', today);
            fetchGroups();
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'auth.html';
        });

        async function fetchGroups() {
            try {
                const result = await apiCall({ action: 'getGroups', ownerId: userId });
                renderGroups(result.groups || []);
            } catch (err) {
                emptyState.style.display = 'flex';
                emptyText.textContent = "We couldn't load your exchanges. " + err.message;
            } finally {
                pageLoader.style.display = 'none';
            }
        }

        function renderGroups(groups) {
            groupsList.innerHTML = '';
            if (groups.length === 0) {
                emptyState.style.display = 'flex';
                emptyText.textContent = "You haven't created any exchanges yet.";
                return;
            }
            emptyState.style.display = 'none';
            groups.sort((a, b) => new Date(a.date) - new Date(b.date));

            groups.forEach(group => {
                let formattedDate = group.date;
                if (group.date !== 'TBA') {
                    const dateParts = group.date.split('T')[0].split('-');
                    const localDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                    formattedDate = localDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                }
                
                const isSent = group.numEmails > 0;

                const div = document.createElement('div');
                div.className = `group-item ${isSent ? 'dispatched' : ''}`;
                div.onclick = (e) => {
                    // Prevent navigation if they clicked the trash can
                    if (!e.target.closest('.delete-group-btn')) {
                        window.location.href = `group.html?id=${group.id}`;
                    }
                };
                div.innerHTML = `
                    <div class="group-info">
                        <h3>${group.name} ${isSent ? '<span class="status-badge">Emails Sent</span>' : ''}</h3>
                        <p>Exchange Date: ${formattedDate}</p>
                    </div>
                    <div class="group-actions">
                        <button type="button" class="delete-group-btn" title="Delete Exchange" onclick="deleteGroup('${group.id}', event)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                        <div class="group-arrow">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </div>
                    </div>
                `;
                groupsList.appendChild(div);
            });
        }

        async function deleteGroup(groupId, event) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to permanently delete this exchange and all its participants? This cannot be undone.")) return;
            
            try {
                await apiCall({ action: 'deleteGroup', ownerId: userId, groupId: groupId });
                fetchGroups(); // Refresh UI instantly
            } catch (err) {
                alert("Failed to delete exchange: " + err.message);
            }
        }

        const isTbaCheckbox = document.getElementById('isTba');
        const exchangeDateInput = document.getElementById('exchangeDate');
        const exchangeTimeInput = document.getElementById('exchangeTime');
        
        isTbaCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                exchangeDateInput.disabled = true;
                exchangeDateInput.removeAttribute('required');
                exchangeTimeInput.disabled = true;
            } else {
                exchangeDateInput.disabled = false;
                exchangeDateInput.setAttribute('required', 'true');
                exchangeTimeInput.disabled = false;
            }
        });

        createForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const groupName = document.getElementById('groupName').value.trim();
            const exchangeDate = isTbaCheckbox.checked ? 'TBA' : exchangeDateInput.value;
            let budget = document.getElementById('groupBudget').value.trim();
            if (budget && !budget.startsWith('$')) budget = '$' + budget;
            const exchangeTime = isTbaCheckbox.checked ? '' : exchangeTimeInput.value;
            
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const result = await apiCall({ action: 'createGroup', ownerId: userId, groupName, exchangeDate, budget, exchangeTime });
                window.location.href = `group.html?id=${result.group.id}`;
            } catch (err) {
                errorMsg.textContent = "Failed to create exchange. " + err.message;
                errorMsg.style.display = 'block';
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
